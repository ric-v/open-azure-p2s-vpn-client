name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 make perl file autoconf automake libtool pkg-config

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: .build/dl
          key: dl-${{ hashFiles('build/versions.env') }}

      - name: Build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          bash build/build.sh

      - name: Checksum
        run: cd dist && sha256sum P2SVpn.exe | tee P2SVpn.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: P2SVpn
          path: |
            dist/P2SVpn.exe
            dist/P2SVpn.exe.sha256

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/P2SVpn.exe dist/P2SVpn.exe.sha256 \
            --title "P2S VPN ${GITHUB_REF_NAME#v}" --generate-notes
